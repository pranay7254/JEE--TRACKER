<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Trio - Daily Tracker</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.92); 
            --accent-primary: #38bdf8;
            --accent-saffron: #f97316;
            --accent-green: #10b981;
            --accent-edit: #eab308;
            --accent-delete: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: linear-gradient(180deg, #7c2d12 0%, #0f172a 50%, #064e3b 100%); 
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            padding: 2rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 1.5rem; }
        h1 { 
            font-size: 2.5rem; 
            background: linear-gradient(90deg, #fb923c, #f8fafc, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .header-top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }

        .admin-nav-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-nav-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .user-status-bar {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .presence-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 2rem;
        }

        .presence-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .presence-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        .presence-time {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            padding: 1.5rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            height: fit-content;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-main); }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        select, input {
            width: 100%; padding: 0.75rem; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a; color: white;
            font-size: 1rem;
        }
        button.btn-submit {
            width: 100%; padding: 0.85rem; border-radius: 8px; border: none;
            background: linear-gradient(90deg, #ea580c, #16a34a); color: white; font-size: 1rem;
            font-weight: 700; cursor: pointer; transition: opacity 0.2s;
        }
        button.btn-submit:hover { opacity: 0.9; }

        .feed-box { max-height: 600px; overflow-y: auto; padding-right: 0.5rem; }
        .log-item {
            background: #0f172a; padding: 1rem; border-radius: 8px;
            margin-bottom: 1rem; border-left: 4px solid var(--accent-saffron);
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .log-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 0.75rem;}
        .action-btns { display: flex; gap: 6px; }
        
        .tag { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .tag-p { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
        .tag-c { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-m { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

        .btn-edit {
            background-color: var(--accent-edit);
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-delete {
            background-color: var(--accent-delete);
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top-bar">
        <button class="admin-nav-btn" onclick="goToAdmin()">🛠️ Admin Panel</button>
    </div>

    <header>
        <h1>🎯 JEE Target Tracker</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Class 11 Daily Log Dashboard</p>
    </header>

    <div class="user-status-bar">
        Welcome back, <strong id="currentIdentifiedUser" style="color: #38bdf8;">Authenticating...</strong>
    </div>

    <div class="presence-container">
        <div class="presence-card">
            <span class="presence-name"><span class="pulse-dot"></span> Pranay</span>
            <span class="presence-time" id="status-Pranay">Checking...</span>
        </div>
        <div class="presence-card">
            <span class="presence-name"><span class="pulse-dot"></span> Abhigyan</span>
            <span class="presence-time" id="status-Abhigyan">Checking...</span>
        </div>
        <div class="presence-card">
            <span class="presence-name"><span class="pulse-dot"></span> Pranjal</span>
            <span class="presence-time" id="status-Pranjal">Checking...</span>
        </div>
        <div class="presence-card">
            <span class="presence-name"><span class="pulse-dot"></span> Aayush</span>
            <span class="presence-time" id="status-Aayush">Checking...</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Log Your Work</h2>
            <form id="trackerForm">
                <div class="form-group">
                    <label for="student">Logged in User</label>
                    <input type="text" id="student" readonly style="background: #1e293b; color: #38bdf8; font-weight: bold; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" required>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Math">Mathematics</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studyHours">Study Hours</label>
                    <input type="number" id="studyHours" step="0.5" min="0.5" max="24" placeholder="e.g., 2.5" required>
                </div>
                <div class="form-group">
                    <label for="topic">Topic/Chapter Name</label>
                    <input type="text" id="topic" placeholder="e.g., Kinematics, Mole Concept" required>
                </div>
                <div class="form-group">
                    <label for="details">What did you accomplish?</label>
                    <input type="text" id="details" placeholder="e.g., Solved 30 HC Verma questions" required>
                </div>
                <button type="submit" class="btn-submit">Publish Update</button>
            </form>
        </div>

        <div class="card">
            <h2>Group Update Feed</h2>
            <div id="feedContainer" class="feed-box">
                <p style="color: var(--text-muted);">Connecting to database...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const pinToUser = {
        "4440": "Pranay",
        "5670": "Abhigyan",
        "3890": "Pranjal",
        "2340": "Aayush"
    };

    const userToPin = {
        "Pranay": "4440",
        "Abhigyan": "5670",
        "Pranjal": "3890",
        "Aayush": "2340"
    };

    const firebaseConfig = {
        apiKey: "AIzaSyAB6FbsDLh4xq6ikvsSFFrDLYFVDaYB978",
        authDomain: "jee-tracker-6b67d.firebaseapp.com",
        projectId: "jee-tracker-6b67d",
        storageBucket: "jee-tracker-6b67d.firebasestorage.app",
        messagingSenderId: "14514591368",
        appId: "1:14514591368:web:9e72203c576dfaa5e9713d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let loggedInUser = sessionStorage.getItem("jee_authenticated_user");

    if (!loggedInUser || !userToPin[loggedInUser]) {
        let enteredPin = prompt("🔐 Enter your personal 4-digit PIN to login:");
        if (enteredPin && pinToUser[enteredPin]) {
            loggedInUser = pinToUser[enteredPin];
            sessionStorage.setItem("jee_authenticated_user", loggedInUser);
        } else {
            alert("❌ Incorrect PIN! Access Denied.");
            document.body.innerHTML = "<div style='color:white; text-align:center; margin-top:20vh; font-family:sans-serif;'><h1>🔒 Access Denied</h1><p>Invalid PIN. Refresh the page to try again.</p></div>";
            throw new Error("Unauthorized access stopped.");
        }
    }

    document.getElementById("currentIdentifiedUser").innerText = loggedInUser;
    document.getElementById("student").value = loggedInUser;

    db.collection("user_presence").doc(loggedInUser).set({
        lastActive: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./firebase-messaging-sw.js').then((registration) => {
            const messaging = firebase.messaging();
            messaging.useServiceWorker(registration);
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    messaging.getToken({ vapidkey: 'BMkFrIBnJGNhTmCTm0I01_cy7tmn6y4-iHodUfHCoy9SW8FXJZLrHt92u5lnqtoBVGvaDpHr7S9zileZgJyXE7I' }).then((currentToken) => {
                        if (currentToken && loggedInUser) {
                            db.collection("user_devices").doc(loggedInUser).set({
                                token: currentToken,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });
                        }
                    }).catch((err) => console.log('Token fetch error:', err));
                }
            });
        }).catch(err => console.log('SW registration error:', err));
    }

    window.goToAdmin = function() {
        let pass = prompt("🔐 Enter Master Admin Password to continue:");
        if (pass === "Pra4nay4") {
            sessionStorage.setItem("admin_auth", "true");
            window.location.href = "admin.html";
        } else if (pass !== null) {
            alert("❌ Incorrect Admin Password!");
        }
    };

    const form = document.getElementById('trackerForm');
    const feedContainer = document.getElementById('feedContainer');

    db.collection("user_presence").onSnapshot((snapshot) => {
        snapshot.forEach((doc) => {
            const data = doc.data();
            const memberId = doc.id;
            const statusEl = document.getElementById(`status-${memberId}`);
            if (statusEl && data.lastActive) {
                const dateObj = data.lastActive.toDate();
                statusEl.innerText = dateObj.toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }) + " (" + dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ")";
            }
        });
    });

    window.editLog = async function(docId, studentName, oldHours, oldTopic, oldDetails) {
        if (studentName !== loggedInUser) {
            alert(`❌ You cannot edit logs belonging to ${studentName}!`);
            return;
        }

        let enteredPin = prompt(`🔐 Enter your PIN (${studentName}) to confirm edit:`);
        if (userToPin[studentName] !== enteredPin) {
            alert("❌ Incorrect PIN! Access Denied.");
            return;
        }

        let newHours = prompt("✏️ Enter updated study hours:", oldHours);
        if (newHours === null) return;

        let newTopic = prompt("✏️ Enter updated Topic/Chapter:", oldTopic);
        if (newTopic === null) return;

        let newDetails = prompt("✏️ Enter updated Accomplishment details:", oldDetails);
        if (newDetails === null) return;

        try {
            await db.collection("jee_logs").doc(docId).update({
                studyHours: parseFloat(newHours),
                topic: newTopic,
                details: newDetails,
                editedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("✅ Log updated successfully!");
        } catch (error) {
            alert("❌ Failed to update log: " + error.message);
        }
    };

    window.deleteLog = async function(docId, studentName) {
        if (studentName !== loggedInUser) {
            alert(`❌ You cannot delete logs belonging to ${studentName}!`);
            return;
        }

        let enteredPin = prompt(`🔐 Enter your PIN (${studentName}) to confirm deletion:`);
        if (userToPin[studentName] !== enteredPin) {
            alert("❌ Incorrect PIN! Access Denied.");
            return;
        }

        if (confirm("⚠️ Are you sure you want to permanently delete this log?")) {
            try {
                await db.collection("jee_logs").doc(docId).delete();
                alert("🗑️ Log deleted successfully!");
            } catch (error) {
                alert("❌ Failed to delete log: " + error.message);
            }
        }
    };

    db.collection("jee_logs")
      .orderBy("timestamp", "desc")
      .onSnapshot((snapshot) => {
          feedContainer.innerHTML = '';
          if (snapshot.empty) {
              feedContainer.innerHTML = '<p style="color: var(--text-muted);">No logs posted yet. Start studying!</p>';
              return;
          }
          
          snapshot.forEach((docSnap) => {
              const log = docSnap.data();
              const logId = docSnap.id;

              let tagClass = 'tag-p';
              if(log.subject === 'Chemistry') tagClass = 'tag-c';
              if(log.subject === 'Math') tagClass = 'tag-m';

              const formattedTime = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString([], { 
                  month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
              }) : 'Just now';

              const hoursDisplay = log.studyHours ? ` — <strong>${log.studyHours} hrs</strong>` : '';
              const detailsDisplay = log.details || log.accomplishment || '';

              const logElement = document.createElement('div');
              logElement.className = 'log-item';
              logElement.innerHTML = `
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                      <strong style="color: #38bdf8; font-size: 1.1rem;">${log.student}${hoursDisplay}</strong>
                      <span class="tag ${tagClass}">${log.subject || 'General'}</span>
                  </div>
                  <p style="margin: 0.5rem 0; font-weight: 500;">📖 ${log.topic}</p>
                  <p style="color: var(--text-muted); font-size: 0.95rem;">✅ ${detailsDisplay}</p>
                  <div class="log-meta">
                      <span>🕒 ${formattedTime}</span>
                      <div class="action-btns">
                          <button class="btn-edit" onclick="editLog('${logId}', '${log.student}', '${log.studyHours || 0}', '${(log.topic || '').replace(/'/g, "\\'")}', '${detailsDisplay.replace(/'/g, "\\'")}')">
                              ✏️ Edit
                          </button>
                          <button class="btn-delete" onclick="deleteLog('${logId}', '${log.student}')">
                              🗑️ Delete
                          </button>
                      </div>
                  </div>
              `;
              feedContainer.appendChild(logElement);
          });
      }, (error) => {
          feedContainer.innerHTML = '<p style="color: var(--error);">Failed to connect. Make sure Firebase config is correct!</p>';
      });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const student = loggedInUser;
        const subject = document.getElementById('subject').value;
        const studyHours = parseFloat(document.getElementById('studyHours').value);
        const topic = document.getElementById('topic').value;
        const details = document.getElementById('details').value;

        try {
            await db.collection("jee_logs").add({
                student: student,
                subject: subject,
                studyHours: studyHours,
                topic: topic,
                details: details,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('studyHours').value = '';
            document.getElementById('topic').value = '';
            document.getElementById('details').value = '';
            alert("✅ Log published successfully!");
        } catch (error) {
            alert("Error uploading to cloud: " + error.message);
        }
    });
</script>
</body>
</html>
