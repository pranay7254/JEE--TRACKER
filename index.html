<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Trio - Daily Tracker</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #3b82f6;
            --accent-success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            padding: 2rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.5rem; color: var(--accent-primary); }
        
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 1.5rem; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            height: fit-content;
        }

        h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-main); }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        select, input {
            width: 100%; padding: 0.75rem; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: white;
            font-size: 1rem;
        }
        button {
            width: 100%; padding: 0.75rem; border-radius: 6px; border: none;
            background: var(--accent-primary); color: white; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        
        #error-msg { color: var(--error); font-size: 0.9rem; margin-top: 0.5rem; display: none; }

        /* Dashboard Feed styling */
        .feed-box { max-height: 600px; overflow-y: auto; padding-right: 0.5rem; }
        .log-item {
            background: #0f172a; padding: 1rem; border-radius: 8px;
            margin-bottom: 1rem; border-left: 4px solid var(--accent-primary);
        }
        .log-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;}
        .tag { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .tag-p { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag-c { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-m { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎯 JEE Target Tracker</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Class 11 Daily Log Dashboard</p>
    </header>

    <div class="grid">
        <!-- Input Form -->
        <div class="card">
            <h2>Log Your Work</h2>
            <form id="trackerForm">
                <div class="form-group">
                    <label for="student">Who are you?</label>
                    <select id="student" required>
                        <option value="Pranay">Pranay</option>
                        <option value="Abhigyan">Abhigyan</option>
                        <option value="Pranjal">Pranjal</option>
                        <option value="Aayush">Aayush</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Enter Your Pin/Password</label>
                    <input type="password" id="password" placeholder="••••" required autocomplete="current-password">
                    <div id="error-msg">❌ Incorrect password. Access denied.</div>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" required>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Math">Mathematics</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="topic">Topic/Chapter Name</label>
                    <input type="text" id="topic" placeholder="e.g., Kinematics, Mole Concept" required>
                </div>
                <div class="form-group">
                    <label for="details">What did you accomplish?</label>
                    <input type="text" id="details" placeholder="e.g., Solved 30 HC Verma questions" required>
                </div>
                <button type="submit">Publish Update</button>
            </form>
        </div>

        <!-- Live Feed Dashboard -->
        <div class="card">
            <h2>Group Update Feed</h2>
            <div id="feedContainer" class="feed-box">
                <p style="color: var(--text-muted);">Connecting to database...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // 🔐 Password keys Mapping
    const credentials = {
        "Pranay": "4440",
        "Abhigyan": "5670",
        "Pranjal": "3890",
        "Aayush": "2340"
    };

    // 🔥 YOUR FIREBASE CONFIGURATION GOES HERE
    // (Follow Step 1 below to get these keys from console.firebase.google.com)
    const firebaseConfig = {
        apiKey: "AIzaSyAB6FbsDLh4xq6ikvsSFFrDLYFVDaYB978",
  authDomain: "jee-tracker-6b67d.firebaseapp.com",
  projectId: "jee-tracker-6b67d",
  storageBucket: "jee-tracker-6b67d.firebasestorage.app",
  messagingSenderId: "14514591368",
  appId: "1:14514591368:web:9e72203c576dfaa5e9713d"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('trackerForm');
    const feedContainer = document.getElementById('feedContainer');
    const errorMsg = document.getElementById('error-msg');

    // 🔄 Fetch and Listen to live data changes
    db.collection("jee_logs")
      .orderBy("timestamp", "desc")
      .onSnapshot((snapshot) => {
          feedContainer.innerHTML = '';
          if (snapshot.empty) {
              feedContainer.innerHTML = '<p style="color: var(--text-muted);">No logs posted yet. Start studying!</p>';
              return;
          }
          
          snapshot.forEach((doc) => {
              const log = doc.data();
              let tagClass = 'tag-p';
              if(log.subject === 'Chemistry') tagClass = 'tag-c';
              if(log.subject === 'Math') tagClass = 'tag-m';

              // Convert timestamp safely
              const formattedTime = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString([], { 
                  month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
              }) : 'Just now';

              const logElement = document.createElement('div');
              logElement.className = 'log-item';
              logElement.innerHTML = `
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                      <strong style="color: var(--accent-primary); font-size: 1.1rem;">${log.student}</strong>
                      <span class="tag ${tagClass}">${log.subject}</span>
                  </div>
                  <p style="margin: 0.5rem 0; font-weight: 500;">${log.topic}</p>
                  <p style="color: var(--text-muted); font-size: 0.95rem;">${log.details}</p>
                  <div class="log-meta">
                      <span>🕒 ${formattedTime}</span>
                  </div>
              `;
              feedContainer.appendChild(logElement);
          });
      }, (error) => {
          console.error("Error reading database: ", error);
          feedContainer.innerHTML = '<p style="color: var(--error);">Failed to connect. Make sure Firebase config is correct!</p>';
      });

    // 📥 Form Submission with Password Verification
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const student = document.getElementById('student').value;
        const enteredPassword = document.getElementById('password').value;

        // Verify password
        if (credentials[student] !== enteredPassword) {
            errorMsg.style.display = 'block';
            return;
        }

        const subject = document.getElementById('subject').value;
        const topic = document.getElementById('topic').value;
        const details = document.getElementById('details').value;

        try {
            // Write data securely to Cloud Firestore
            await db.collection("jee_logs").add({
                student: student,
                subject: subject,
                topic: topic,
                details: details,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Clear just the fields, leave student name selection
            document.getElementById('password').value = '';
            document.getElementById('topic').value = '';
            document.getElementById('details').value = '';
        } catch (error) {
            alert("Error uploading to cloud: " + error.message);
        }
    });
</script>
</body>
</html>
