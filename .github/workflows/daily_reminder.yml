name: Weekly Sunday Report Card

on:
  schedule:
    # 15:30 UTC = 9:00 PM IST (Every Sunday)
    - cron: '30 15 * * 0'
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase Admin & Axios
        run: npm install firebase-admin axios

      - name: Generate & Send Weekly Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
          const admin = require("firebase-admin");
          const axios = require("axios");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });
          const db = admin.firestore();

          async function run() {
            const now = new Date();
            const startOfWeek = new Date();
            const day = startOfWeek.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            startOfWeek.setDate(startOfWeek.getDate() - diff);
            startOfWeek.setHours(0, 0, 0, 0);

            const snapshot = await db.collection("jee_logs").get();
            
            // Chaaron students included hain
            let weeklyStats = {
              "Pranay": { theory: 0, practice: 0, revision: 0, qs: 0, lectures: 0, mobile: 0 },
              "Abhigyan": { theory: 0, practice: 0, revision: 0, qs: 0, lectures: 0, mobile: 0 },
              "Pranjal": { theory: 0, practice: 0, revision: 0, qs: 0, lectures: 0, mobile: 0 },
              "Aayush": { theory: 0, practice: 0, revision: 0, lectures: 0, qs: 0, mobile: 0 }
            };

            snapshot.forEach(doc => {
              const d = doc.data();
              const student = d.student;
              const logDate = d.timestamp ? d.timestamp.toDate() : new Date();
              const hours = parseFloat(d.studyHours || d.hours || 0);
              const qs = parseInt(d.questionsSolved || 0, 10);
              const act = (d.activityType || d.activity || "").toLowerCase();

              if (logDate >= startOfWeek && weeklyStats[student]) {
                if (act.includes("mobile")) {
                  weeklyStats[student].mobile += hours;
                } else if (act.includes("practice")) {
                  weeklyStats[student].practice += hours;
                  weeklyStats[student].qs += qs;
                } else if (act.includes("revision")) {
                  weeklyStats[student].revision += hours;
                } else if (act.includes("lecture")) {
                  weeklyStats[student].lectures += hours;
                } else if (act.includes("self")) {
                  weeklyStats[student].theory += hours;
                }
              }
            });

            const rangeStr = `${startOfWeek.getDate()} ${startOfWeek.toLocaleString("default", { month: "short" })} - ${now.getDate()} ${now.toLocaleString("default", { month: "short" })}`;

            let msg = "📊 *JEE TRIO - OFFICIAL WEEKLY REPORT CARD* 🎯\n";
            msg += `🗓 *Week:* ${rangeStr}\n`;
            msg += "─────────────────────────\n\n";

            Object.keys(weeklyStats).forEach(name => {
              const s = weeklyStats[name];
              const pureStudy = (s.theory + s.practice + s.revision).toFixed(1);
              msg += `👤 *${name}*\n`;
              msg += `• 📖 Theory: \`${s.theory.toFixed(1)} hrs\`\n`;
              msg += `• ✍️ Practice: \`${s.practice.toFixed(1)} hrs\` (${s.qs} Qs)\n`;
              msg += `• 🔄 Revision: \`${s.revision.toFixed(1)} hrs\`\n`;
              msg += `• 🎥 Lectures: \`${s.lectures.toFixed(1)} hrs\`\n`;
              msg += `• 📱 Screen Time: \`${s.mobile.toFixed(1)} hrs\`\n`;
              msg += `👉 *Total Pure Study:* *${pureStudy} hrs*\n\n`;
            });

            msg += "─────────────────────────\n";
            msg += "🔥 _Consistency beats talent. Target JEE 2028!_";

            const tgUrl = `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`;
            await axios.post(tgUrl, {
              chat_id: process.env.TELEGRAM_CHAT_ID,
              text: msg,
              parse_mode: "Markdown"
            });
            console.log("Weekly scorecard sent successfully!");
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '
