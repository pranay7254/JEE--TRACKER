name: Combined 6 AM Inactivity Check

on:
  schedule:
    # 00:38 UTC = 6:08 AM IST
    - cron: '38 0 * * *'
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Trigger Combined Telegram + Web Push Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
          const https = require("https");
          const admin = require("firebase-admin");

          async function checkAndAlert() {
            const botToken = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

            admin.initializeApp({
              credential: admin.credential.cert(serviceAccount)
            });

            const db = admin.firestore();
            const yesterday = new Date(Date.now() - 86400000);
            const startOfYesterday = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate(), 0, 0, 0);

            const logsSnap = await db.collection("jee_logs").where("timestamp", ">=", startOfYesterday).get();
            const activeMembers = new Set();
            logsSnap.forEach(doc => {
              const data = doc.data();
              if (data.student) activeMembers.add(data.student);
            });

            const members = ["Pranay", "Abhigyan", "Pranjal", "Aayush"];
            const defaulters = members.filter(m => !activeMembers.has(m));

            if (defaulters.length > 0) {
              // 1. Telegram Group Notification
              if (botToken && chatId) {
                const message = encodeURIComponent(
                  "🚨 *JEE Tracker 6:00 AM Alert*\n\n" +
                  "The following members *FAILED* to post their study log yesterday:\n" +
                  defaulters.map(d => "❌ @" + d).join("\n") +
                  "\n\n⚠️ Daily rule: Every member must log at least 1 study task daily!"
                );
                const tgUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${message}&parse_mode=Markdown`;
                https.get(tgUrl, () => console.log("Telegram alert sent."));
              }

              // 2. Direct Device Web Push via Modern Admin SDK
              for (const member of defaulters) {
                const devDoc = await db.collection("user_devices").doc(member).get();
                if (devDoc.exists && devDoc.data().token) {
                  try {
                    await admin.messaging().send({
                      token: devDoc.data().token,
                      notification: {
                        title: "⚠️ Missing Study Log!",
                        body: `Hey ${member}, you did not log your study hours yesterday. Update your log now!`
                      }
                    });
                    console.log("Push sent to " + member);
                  } catch (err) {
                    console.error("Push error for " + member, err);
                  }
                }
              }
            } else {
              console.log("All members posted yesterday. No alert required.");
            }
          }

          checkAndAlert();
          '
